name: Release FINAL

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Strict SemVer release version without a leading v"
        required: true
        default: "0.5.2"
      rc3_release_tag:
        description: "GitHub prerelease tag containing the byte-approved RC3 base"
        required: true
        default: "build-base-v0.5.2-rc3"

permissions:
  contents: read

concurrency:
  group: release-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate FINAL metadata and qualification
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      source_artifact_name: ${{ steps.release.outputs.source_artifact_name }}
      checksum_name: ${{ steps.release.outputs.checksum_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Resolve official release version
        id: release
        shell: bash
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(python scripts/release_utils.py resolve-version \
            --event-name "$RELEASE_EVENT_NAME" \
            --ref-name "$RELEASE_REF_NAME" \
            --input-version "$RELEASE_INPUT_VERSION" \
            --qualifier final)"
          python scripts/release_utils.py validate-project-version \
            --version "$VERSION" \
            --metadata src/hunter_metadata.py
          ARTIFACT_NAME="$(python scripts/release_utils.py artifact-name \
            --version "$VERSION" --qualifier final)"
          SOURCE_ARTIFACT_NAME="$(python scripts/release_utils.py artifact-name \
            --version "$VERSION" --platform source --qualifier final)"
          CHECKSUM_NAME="$(python scripts/release_utils.py checksum-name \
            --version "$VERSION" --qualifier final)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "source_artifact_name=$SOURCE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$CHECKSUM_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify committed FINAL qualification or explicit waiver
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          if [[ -f FINAL_8H_SOAK_WAIVER.json ]] && \
             [[ ! -e FINAL_8H_SINGLE_INSTANCE_SOAK.json ]] && \
             [[ ! -e FINAL_8H_THREE_NAMED_INSTANCES_SOAK.json ]] && \
             [[ ! -e FINAL_QUALIFICATION_CONTEXT.json ]]; then
            python scripts/final_qualification.py verify-waiver \
              --waiver FINAL_8H_SOAK_WAIVER.json
          elif [[ ! -e FINAL_8H_SOAK_WAIVER.json ]] && \
               [[ -f FINAL_8H_SINGLE_INSTANCE_SOAK.json ]] && \
               [[ -f FINAL_8H_THREE_NAMED_INSTANCES_SOAK.json ]] && \
               [[ -f FINAL_QUALIFICATION_CONTEXT.json ]]; then
            python scripts/final_qualification.py verify \
              --single FINAL_8H_SINGLE_INSTANCE_SOAK.json \
              --three FINAL_8H_THREE_NAMED_INSTANCES_SOAK.json \
              --context FINAL_QUALIFICATION_CONTEXT.json \
              --repo-root . \
              --release-commit "$RELEASE_COMMIT"
          else
            echo "FINAL qualification must contain exactly one complete mode: 8H evidence or explicit waiver." >&2
            exit 1
          fi

  test:
    name: FINAL full regression and security gates
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirement.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt -r requirements-dev.txt

      - name: Run all release gates
        run: |
          python -m compileall src tests scripts
          ruff check src tests scripts
          mypy
          python -m pytest
          pip-audit -r requirement.txt
          bandit -r src scripts -lll -c pyproject.toml

  build-assets:
    name: Build and verify FINAL Windows asset
    runs-on: windows-latest
    needs:
      - validate
      - test
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.commit.outputs.release_commit }}

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements-lock-windows-py311.txt
            requirements-dev.txt

      - name: Install exact Windows dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock-windows-py311.txt
          python -m pip install -r requirements-dev.txt

      - name: Resolve exact release commit
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ReleaseCommit = (git rev-parse "$env:GITHUB_SHA^{}").Trim()
          if ($ReleaseCommit -cnotmatch '^[0-9a-f]{40}$') {
            throw "Unable to resolve an exact lowercase release commit."
          }
          "release_commit=$ReleaseCommit" >> $env:GITHUB_OUTPUT

      - name: Download and verify v0.5.2 RC3 Windows base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RC3_RELEASE_TAG: ${{ inputs.rc3_release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $BaseDir = "dist/base"
          $BaseArchive = Join-Path $BaseDir "hunterX_windows_0.5.2_rc3.zip"
          $ExpectedSha256 = "f2ec4f918e50de5c78c2303a184ef54b0ce69d1ba2f87d34365d87be59d46cd9"
          $BaseReleaseTag = $env:RC3_RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($BaseReleaseTag)) {
            $BaseReleaseTag = "build-base-v0.5.2-rc3"
          }
          New-Item -ItemType Directory -Path $BaseDir -Force | Out-Null
          gh release download $BaseReleaseTag `
            --repo "${{ github.repository }}" `
            --pattern "hunterX_windows_0.5.2_rc3.zip" `
            --dir $BaseDir `
            --clobber
          if (-not (Test-Path -LiteralPath $BaseArchive -PathType Leaf)) {
            throw "The exact v0.5.2 RC3 Windows base was not downloaded."
          }
          $ActualSha256 = (Get-FileHash -LiteralPath $BaseArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualSha256 -cne $ExpectedSha256) {
            throw "The v0.5.2 RC3 Windows base SHA-256 does not match."
          }

      - name: Build and fresh-extract smoke FINAL Windows package
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Version "${{ needs.validate.outputs.version }}" -BaseArchive "dist/base/hunterX_windows_0.5.2_rc3.zip" -Commit "${{ steps.commit.outputs.release_commit }}" -Qualifier final

      - name: Upload verified FINAL Windows asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-final-windows-${{ needs.validate.outputs.version }}
          path: dist/release/${{ needs.validate.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 3

  publish-release:
    name: Publish official HunterX release
    runs-on: ubuntu-latest
    needs:
      - validate
      - test
      - build-assets
    permissions:
      contents: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build-assets.outputs.release_commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Download verified FINAL Windows asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-final-windows-${{ needs.validate.outputs.version }}
          path: dist/release

      - name: Build FINAL source from the same clean commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_source_archive.py \
            --version "${{ needs.validate.outputs.version }}" \
            --output "dist/release/${{ needs.validate.outputs.source_artifact_name }}" \
            --repo-root . \
            --commit "${{ needs.build-assets.outputs.release_commit }}" \
            --qualifier final

      - name: Write and verify exact FINAL checksums and parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_release_checksums.py \
            --version "${{ needs.validate.outputs.version }}" \
            --output "dist/release/${{ needs.validate.outputs.checksum_name }}" \
            --qualifier final \
            "dist/release/${{ needs.validate.outputs.artifact_name }}" \
            "dist/release/${{ needs.validate.outputs.source_artifact_name }}"
          python scripts/write_release_checksums.py \
            --version "${{ needs.validate.outputs.version }}" \
            --verify-manifest "dist/release/${{ needs.validate.outputs.checksum_name }}" \
            --asset-dir dist/release \
            --qualifier final
          python scripts/verify_release_archive.py pair \
            --windows-archive "dist/release/${{ needs.validate.outputs.artifact_name }}" \
            --source-archive "dist/release/${{ needs.validate.outputs.source_artifact_name }}" \
            --version "${{ needs.validate.outputs.version }}" \
            --repo-root . \
            --commit "${{ needs.build-assets.outputs.release_commit }}" \
            --qualifier final

      - name: Publish non-prerelease v0.5.2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          Version="${{ needs.validate.outputs.version }}"
          Tag="v$Version"
          ReleaseCommit="${{ needs.build-assets.outputs.release_commit }}"
          ReleaseDir="dist/release"
          WindowsAsset="$ReleaseDir/${{ needs.validate.outputs.artifact_name }}"
          SourceAsset="$ReleaseDir/${{ needs.validate.outputs.source_artifact_name }}"
          ChecksumAsset="$ReleaseDir/${{ needs.validate.outputs.checksum_name }}"
          NotesPath="RELEASE_NOTES_v0.5.2_FINAL.md"
          git fetch --force --tags origin
          if gh release view "$Tag" >/dev/null 2>&1; then
            ExistingTagCommit="$(git rev-parse "$Tag^{}")"
            if [[ "$ExistingTagCommit" != "$ReleaseCommit" ]]; then
              echo "Refusing to replace $Tag at a different commit." >&2
              exit 1
            fi
            ExistingPrerelease="$(gh release view "$Tag" --json isPrerelease --jq .isPrerelease)"
            if [[ "$ExistingPrerelease" != "false" ]]; then
              echo "Refusing to update $Tag because it is marked prerelease." >&2
              exit 1
            fi
            gh release upload "$Tag" "$WindowsAsset" "$SourceAsset" "$ChecksumAsset" --clobber
          else
            gh release create "$Tag" \
              "$WindowsAsset" \
              "$SourceAsset" \
              "$ChecksumAsset" \
              --target "$ReleaseCommit" \
              --title "HunterX v$Version" \
              --notes-file "$NotesPath"
          fi
