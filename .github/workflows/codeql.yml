name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Strict SemVer release version without a leading v"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      source_artifact_name: ${{ steps.release.outputs.source_artifact_name }}
      checksum_name: ${{ steps.release.outputs.checksum_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Resolve release version
        id: release
        shell: bash
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(python scripts/release_utils.py resolve-version \
            --event-name "$RELEASE_EVENT_NAME" \
            --ref-name "$RELEASE_REF_NAME" \
            --input-version "$RELEASE_INPUT_VERSION")"
          python scripts/release_utils.py validate-project-version \
            --version "$VERSION" \
            --metadata src/hunter_metadata.py
          ARTIFACT_NAME="$(python scripts/release_utils.py artifact-name --version "$VERSION")"
          SOURCE_ARTIFACT_NAME="$(python scripts/release_utils.py artifact-name \
            --version "$VERSION" \
            --platform source)"
          CHECKSUM_NAME="$(python scripts/release_utils.py checksum-name --version "$VERSION")"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "source_artifact_name=$SOURCE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$CHECKSUM_NAME" >> "$GITHUB_OUTPUT"

  test:
    name: Release tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirement.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt -r requirements-dev.txt

      - name: Validate source
        run: |
          python -m compileall src
          ruff check src tests scripts
          mypy
          pytest
          pip-audit -r requirement.txt
          bandit -r src scripts -lll -c pyproject.toml

  publish-release:
    name: Build and publish release assets
    runs-on: windows-latest
    needs:
      - validate
      - test
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirement.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt -r requirements-dev.txt

      - name: Resolve release commit
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ReleaseCommit = (git rev-parse "$env:GITHUB_SHA^{}").Trim()
          if ([string]::IsNullOrWhiteSpace($ReleaseCommit)) {
            throw "Unable to resolve release commit from GITHUB_SHA."
          }
          "release_commit=$ReleaseCommit" >> $env:GITHUB_OUTPUT

      - name: Build source package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/build_source_archive.py `
            --version "${{ needs.validate.outputs.version }}" `
            --output "dist/release/${{ needs.validate.outputs.source_artifact_name }}" `
            --repo-root . `
            --commit "${{ steps.commit.outputs.release_commit }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Source release archive build failed (python exit code $LASTEXITCODE)."
          }

      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Version "${{ needs.validate.outputs.version }}"

      - name: Write checksum manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/write_release_checksums.py `
            --version "${{ needs.validate.outputs.version }}" `
            --output "dist/release/${{ needs.validate.outputs.checksum_name }}" `
            "dist/release/${{ needs.validate.outputs.artifact_name }}" `
            "dist/release/${{ needs.validate.outputs.source_artifact_name }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Release checksum manifest generation failed (python exit code $LASTEXITCODE)."
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $Version = "${{ needs.validate.outputs.version }}"
          $Tag = "v$Version"
          $ReleaseCommit = "${{ steps.commit.outputs.release_commit }}"
          $ReleaseDir = "dist/release"
          $WindowsAsset = Join-Path $ReleaseDir "${{ needs.validate.outputs.artifact_name }}"
          $SourceAsset = Join-Path $ReleaseDir "${{ needs.validate.outputs.source_artifact_name }}"
          $ChecksumAsset = Join-Path $ReleaseDir "${{ needs.validate.outputs.checksum_name }}"
          $NotesPath = Join-Path $ReleaseDir "release-notes.md"

          python scripts/release_utils.py notes --version $Version --changelog CHANGELOG.md |
            Set-Content -LiteralPath $NotesPath -Encoding UTF8
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to generate release notes (python exit code $LASTEXITCODE)."
          }

          git fetch --force --tags origin
          gh release view $Tag *> $null
          $ReleaseExists = $LASTEXITCODE -eq 0

          if ($ReleaseExists) {
            $ExistingTagCommit = (git rev-parse "$Tag^{}").Trim()
            if ($ExistingTagCommit -cne $ReleaseCommit) {
              throw "Refusing to replace assets for $Tag because it points to $ExistingTagCommit, not $ReleaseCommit."
            }
            gh release upload $Tag $WindowsAsset $SourceAsset $ChecksumAsset --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub release asset upload failed (gh exit code $LASTEXITCODE)."
            }
          } else {
            gh release create $Tag `
              $WindowsAsset `
              $SourceAsset `
              $ChecksumAsset `
              --target $ReleaseCommit `
              --title "HunterX v$Version" `
              --notes-file $NotesPath
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed (gh exit code $LASTEXITCODE)."
            }
          }
