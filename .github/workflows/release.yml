name: Release v0.5.2

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Strict SemVer without a leading v"
        required: true
        default: "0.5.2"
      publish:
        description: "Publish the verified official GitHub Release"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release-final-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate FINAL metadata and qualification
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      source_artifact_name: ${{ steps.release.outputs.source_artifact_name }}
      checksum_name: ${{ steps.release.outputs.checksum_name }}
      release_commit: ${{ steps.release.outputs.release_commit }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
      - name: Resolve official release metadata
        id: release
        shell: bash
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(python scripts/release_utils.py resolve-version \
            --event-name workflow_dispatch \
            --ref-name "${GITHUB_REF_NAME}" \
            --input-version "$RELEASE_INPUT_VERSION" \
            --qualifier final)"
          python scripts/release_utils.py validate-project-version \
            --version "$VERSION" --metadata src/hunter_metadata.py
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          ARTIFACT_NAME="$(python scripts/release_utils.py artifact-name \
            --version "$VERSION" --qualifier final)"
          SOURCE_ARTIFACT_NAME="$(python scripts/release_utils.py artifact-name \
            --version "$VERSION" --platform source --qualifier final)"
          CHECKSUM_NAME="$(python scripts/release_utils.py checksum-name \
            --version "$VERSION" --qualifier final)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "source_artifact_name=$SOURCE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$CHECKSUM_NAME" >> "$GITHUB_OUTPUT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Verify committed FINAL qualification or explicit waiver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f FINAL_8H_SOAK_WAIVER.json ]] && \
             [[ ! -e FINAL_8H_SINGLE_INSTANCE_SOAK.json ]] && \
             [[ ! -e FINAL_8H_THREE_NAMED_INSTANCES_SOAK.json ]] && \
             [[ ! -e FINAL_QUALIFICATION_CONTEXT.json ]]; then
            python scripts/final_qualification.py verify-waiver \
              --waiver FINAL_8H_SOAK_WAIVER.json
          elif [[ ! -e FINAL_8H_SOAK_WAIVER.json ]] && \
               [[ -f FINAL_8H_SINGLE_INSTANCE_SOAK.json ]] && \
               [[ -f FINAL_8H_THREE_NAMED_INSTANCES_SOAK.json ]] && \
               [[ -f FINAL_QUALIFICATION_CONTEXT.json ]]; then
            python scripts/final_qualification.py verify \
              --single FINAL_8H_SINGLE_INSTANCE_SOAK.json \
              --three FINAL_8H_THREE_NAMED_INSTANCES_SOAK.json \
              --context FINAL_QUALIFICATION_CONTEXT.json \
              --repo-root . \
              --release-commit "${{ steps.release.outputs.release_commit }}"
          else
            echo "FINAL qualification must contain exactly one complete mode: 8H evidence or explicit waiver." >&2
            exit 1
          fi

  test:
    name: Full regression and security gates
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirement.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt -r requirements-dev.txt
      - name: Run all release gates
        run: |
          python -m compileall src tests scripts
          ruff check src tests scripts
          mypy
          python -m pytest --cov-fail-under=30
          pip-audit -r requirement.txt
          bandit -r src scripts -lll -c pyproject.toml
      - name: Run release benchmarks
        run: python -m pytest tests/benchmarks --benchmark-enable --benchmark-only

  build-windows:
    name: Build source-native FINAL Windows asset
    runs-on: windows-latest
    needs: [validate, test]
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements-lock-windows-py311.txt
            requirements-dev.txt
      - name: Install exact Windows dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock-windows-py311.txt
          python -m pip install -r requirements-dev.txt
      - name: Build and verify FINAL Windows package
        shell: pwsh
        run: |
          ./scripts/build_windows_final.ps1 `
            -Version "${{ needs.validate.outputs.version }}" `
            -Commit "${{ needs.validate.outputs.release_commit }}"
          python scripts/v052_packaged_smoke.py `
            --archive "dist/release/${{ needs.validate.outputs.artifact_name }}"
      - name: Upload verified Windows asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-final-windows-${{ needs.validate.outputs.version }}
          path: dist/release/${{ needs.validate.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 3

  assemble:
    name: Assemble and verify FINAL release set
    runs-on: ubuntu-latest
    needs: [validate, test, build-windows]
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
      - name: Download verified Windows asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-final-windows-${{ needs.validate.outputs.version }}
          path: dist/release
      - name: Build source archive from the same commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_source_archive.py \
            --version "${{ needs.validate.outputs.version }}" \
            --output "dist/release/${{ needs.validate.outputs.source_artifact_name }}" \
            --repo-root . \
            --commit "${{ needs.validate.outputs.release_commit }}" \
            --qualifier final
      - name: Write and verify checksums and archive parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_release_checksums.py \
            --version "${{ needs.validate.outputs.version }}" \
            --output "dist/release/${{ needs.validate.outputs.checksum_name }}" \
            --qualifier final \
            "dist/release/${{ needs.validate.outputs.artifact_name }}" \
            "dist/release/${{ needs.validate.outputs.source_artifact_name }}"
          python scripts/write_release_checksums.py \
            --version "${{ needs.validate.outputs.version }}" \
            --verify-manifest "dist/release/${{ needs.validate.outputs.checksum_name }}" \
            --asset-dir dist/release --qualifier final
          python scripts/verify_release_archive.py windows \
            --archive "dist/release/${{ needs.validate.outputs.artifact_name }}" \
            --version "${{ needs.validate.outputs.version }}" --qualifier final
          python scripts/verify_release_archive.py source \
            --archive "dist/release/${{ needs.validate.outputs.source_artifact_name }}" \
            --version "${{ needs.validate.outputs.version }}" \
            --repo-root . --commit "${{ needs.validate.outputs.release_commit }}" \
            --qualifier final
          python scripts/verify_release_archive.py pair \
            --windows-archive "dist/release/${{ needs.validate.outputs.artifact_name }}" \
            --source-archive "dist/release/${{ needs.validate.outputs.source_artifact_name }}" \
            --version "${{ needs.validate.outputs.version }}" \
            --repo-root . --commit "${{ needs.validate.outputs.release_commit }}" \
            --qualifier final
      - name: Upload verified FINAL release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-final-release-${{ needs.validate.outputs.version }}
          path: |
            dist/release/${{ needs.validate.outputs.artifact_name }}
            dist/release/${{ needs.validate.outputs.source_artifact_name }}
            dist/release/${{ needs.validate.outputs.checksum_name }}
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish official HunterX release
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    needs: [validate, assemble]
    permissions:
      contents: write
    environment: production-release
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
      - name: Download verified FINAL release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-final-release-${{ needs.validate.outputs.version }}
          path: dist/release
      - name: Re-verify and publish immutable v0.5.2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          Version="${{ needs.validate.outputs.version }}"
          ReleaseCommit="${{ needs.validate.outputs.release_commit }}"
          Tag="v$Version"
          ReleaseDir="dist/release"
          WindowsAsset="$ReleaseDir/${{ needs.validate.outputs.artifact_name }}"
          SourceAsset="$ReleaseDir/${{ needs.validate.outputs.source_artifact_name }}"
          ChecksumAsset="$ReleaseDir/${{ needs.validate.outputs.checksum_name }}"
          python scripts/write_release_checksums.py \
            --version "$Version" --verify-manifest "$ChecksumAsset" \
            --asset-dir "$ReleaseDir" --qualifier final
          python scripts/verify_release_archive.py pair \
            --windows-archive "$WindowsAsset" --source-archive "$SourceAsset" \
            --version "$Version" --repo-root . --commit "$ReleaseCommit" \
            --qualifier final
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/$Tag" >/dev/null || \
             gh release view "$Tag" >/dev/null 2>&1; then
            echo "Refusing to replace an existing immutable release or tag: $Tag" >&2
            exit 1
          fi
          gh release create "$Tag" \
            "$WindowsAsset" "$SourceAsset" "$ChecksumAsset" \
            --target "$ReleaseCommit" \
            --title "HunterX v$Version" \
            --notes-file RELEASE_NOTES_v0.5.2_FINAL.md
