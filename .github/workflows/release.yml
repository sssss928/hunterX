name: Release

on:
  push:
    tags:
      - "v*-rc3"
  workflow_dispatch:
    inputs:
      version:
        description: "Strict SemVer release version without a leading v"
        required: true
      rc2_release_tag:
        description: "GitHub prerelease tag containing the byte-approved RC2 base"
        required: true
        default: "v0.5.2-rc2"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      source_artifact_name: ${{ steps.release.outputs.source_artifact_name }}
      checksum_name: ${{ steps.release.outputs.checksum_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Resolve release version
        id: release
        shell: bash
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          QUALIFIER="rc3"
          VERSION="$(python scripts/release_utils.py resolve-version \
            --event-name "$RELEASE_EVENT_NAME" \
            --ref-name "$RELEASE_REF_NAME" \
            --input-version "$RELEASE_INPUT_VERSION" \
            --qualifier "$QUALIFIER")"
          python scripts/release_utils.py validate-project-version \
            --version "$VERSION" \
            --metadata src/hunter_metadata.py
          ARTIFACT_NAME="$(python scripts/release_utils.py artifact-name \
            --version "$VERSION" \
            --qualifier "$QUALIFIER")"
          SOURCE_ARTIFACT_NAME="$(python scripts/release_utils.py artifact-name \
            --version "$VERSION" \
            --platform source \
            --qualifier "$QUALIFIER")"
          CHECKSUM_NAME="$(python scripts/release_utils.py checksum-name \
            --version "$VERSION" \
            --qualifier "$QUALIFIER")"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "source_artifact_name=$SOURCE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$CHECKSUM_NAME" >> "$GITHUB_OUTPUT"

  test:
    name: Release tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirement.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt -r requirements-dev.txt

      - name: Validate source
        run: |
          python -m compileall src tests scripts
          ruff check src tests scripts
          mypy
          python -m pytest
          pip-audit -r requirement.txt
          bandit -r src scripts -lll -c pyproject.toml

  build-assets:
    name: Build and verify release assets
    runs-on: windows-latest
    needs:
      - validate
      - test
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.commit.outputs.release_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements-lock-windows-py311.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock-windows-py311.txt
          python -m pip install -r requirements-dev.txt

      - name: Resolve release commit
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ReleaseCommit = (git rev-parse "$env:GITHUB_SHA^{}").Trim()
          if ([string]::IsNullOrWhiteSpace($ReleaseCommit)) {
            throw "Unable to resolve release commit from GITHUB_SHA."
          }
          "release_commit=$ReleaseCommit" >> $env:GITHUB_OUTPUT

      - name: Download and verify v0.5.2 RC2 Windows base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RC2_RELEASE_TAG: ${{ inputs.rc2_release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $BaseDir = "dist/base"
          $BaseArchive = Join-Path $BaseDir "hunterX_windows_0.5.2_rc2.zip"
          $ExpectedSha256 = "47747a962cf5c4ae49654aec574ca64ac52c27032fc5b1ec1f70d83c3d09da48"
          $BaseReleaseTag = $env:RC2_RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($BaseReleaseTag)) {
            $BaseReleaseTag = "v0.5.2-rc2"
          }
          New-Item -ItemType Directory -Path $BaseDir -Force | Out-Null
          gh release download $BaseReleaseTag `
            --repo "${{ github.repository }}" `
            --pattern "hunterX_windows_0.5.2_rc2.zip" `
            --dir $BaseDir `
            --clobber
          if (-not (Test-Path -LiteralPath $BaseArchive -PathType Leaf)) {
            throw "The v0.5.2 RC2 Windows base was not downloaded."
          }
          $ActualSha256 = (Get-FileHash -LiteralPath $BaseArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualSha256 -cne $ExpectedSha256) {
            throw "The v0.5.2 RC2 Windows base SHA-256 does not match."
          }

      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Version "${{ needs.validate.outputs.version }}" -BaseArchive "dist/base/hunterX_windows_0.5.2_rc2.zip" -Commit "${{ steps.commit.outputs.release_commit }}" -Qualifier rc3

      - name: Upload verified Windows release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-windows-release-${{ needs.validate.outputs.version }}
          path: dist/release/${{ needs.validate.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 3

  publish-release:
    name: Publish verified release assets
    runs-on: ubuntu-latest
    needs:
      - validate
      - test
      - build-assets
    permissions:
      contents: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build-assets.outputs.release_commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Download verified Windows release asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-windows-release-${{ needs.validate.outputs.version }}
          path: dist/release

      - name: Build source package from exact release commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_source_archive.py \
            --version "${{ needs.validate.outputs.version }}" \
            --output "dist/release/${{ needs.validate.outputs.source_artifact_name }}" \
            --repo-root . \
            --commit "${{ needs.build-assets.outputs.release_commit }}" \
            --qualifier rc3

      - name: Write release checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_release_checksums.py \
            --version "${{ needs.validate.outputs.version }}" \
            --output "dist/release/${{ needs.validate.outputs.checksum_name }}" \
            --qualifier rc3 \
            "dist/release/${{ needs.validate.outputs.artifact_name }}" \
            "dist/release/${{ needs.validate.outputs.source_artifact_name }}"

      - name: Verify RC3 release assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_release_checksums.py \
            --version "${{ needs.validate.outputs.version }}" \
            --verify-manifest "dist/release/${{ needs.validate.outputs.checksum_name }}" \
            --asset-dir dist/release \
            --qualifier rc3
          python scripts/verify_release_archive.py windows \
            --archive "dist/release/${{ needs.validate.outputs.artifact_name }}" \
            --version "${{ needs.validate.outputs.version }}" \
            --qualifier rc3
          python scripts/verify_release_archive.py source \
            --archive "dist/release/${{ needs.validate.outputs.source_artifact_name }}" \
            --version "${{ needs.validate.outputs.version }}" \
            --repo-root . \
            --commit "${{ needs.build-assets.outputs.release_commit }}" \
            --qualifier rc3
          python scripts/verify_release_archive.py pair \
            --windows-archive "dist/release/${{ needs.validate.outputs.artifact_name }}" \
            --source-archive "dist/release/${{ needs.validate.outputs.source_artifact_name }}" \
            --version "${{ needs.validate.outputs.version }}" \
            --repo-root . \
            --commit "${{ needs.build-assets.outputs.release_commit }}" \
            --qualifier rc3

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set -euo pipefail
          Version="${{ needs.validate.outputs.version }}"
          Tag="v$Version-rc3"
          ReleaseCommit="${{ needs.build-assets.outputs.release_commit }}"
          ReleaseDir="dist/release"
          WindowsAsset="$ReleaseDir/${{ needs.validate.outputs.artifact_name }}"
          SourceAsset="$ReleaseDir/${{ needs.validate.outputs.source_artifact_name }}"
          ChecksumAsset="$ReleaseDir/${{ needs.validate.outputs.checksum_name }}"
          NotesPath="$ReleaseDir/release-notes.md"
          python scripts/release_utils.py notes --version "$Version" --changelog CHANGELOG.md > "$NotesPath"
          git fetch --force --tags origin
          if gh release view "$Tag" >/dev/null 2>&1; then
            ExistingTagCommit="$(git rev-parse "$Tag^{}")"
            if [[ "$ExistingTagCommit" != "$ReleaseCommit" ]]; then
              echo "Refusing to replace assets for $Tag because it points to $ExistingTagCommit, not $ReleaseCommit." >&2
              exit 1
            fi
            ExistingPrerelease="$(gh release view "$Tag" --json isPrerelease --jq .isPrerelease)"
            if [[ "$ExistingPrerelease" != "true" ]]; then
              echo "Refusing to update $Tag because it is not a prerelease." >&2
              exit 1
            fi
            gh release upload "$Tag" "$WindowsAsset" "$SourceAsset" "$ChecksumAsset" --clobber
          else
            gh release create "$Tag" \
              "$WindowsAsset" \
              "$SourceAsset" \
              "$ChecksumAsset" \
              --target "$ReleaseCommit" \
              --title "HunterX v$Version RC3" \
              --notes-file "$NotesPath" \
              --prerelease
          fi
