name: CI

on:
  push:
    branches:
      - main
      - feature
      - feature/**
      - fix
      - fix/**
      - chore
      - chore/**
      - refactor
      - refactor/**
      - docs
      - docs/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test, lint, audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirement.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt -r requirements-dev.txt

      - name: Compile source, tests, and scripts
        run: python -m compileall src tests scripts

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy

      - name: Pytest with coverage
        run: python -m pytest --cov-fail-under=30

      - name: Dependency audit
        run: pip-audit -r requirement.txt

      - name: Bandit high severity scan
        run: bandit -r src scripts -lll -c pyproject.toml

      - name: Benchmarks
        run: |
          python -m pytest tests/benchmarks --benchmark-enable --benchmark-only --benchmark-json=benchmark.json
          python scripts/render_benchmark_chart.py --input benchmark.json --output benchmark-summary.md

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 3

      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-report
          path: |
            benchmark.json
            benchmark-summary.md
          if-no-files-found: error
          retention-days: 3

  windows-build-smoke:
    name: Windows runtime and release-contract smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements-lock-windows-py311.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock-windows-py311.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify Windows entrypoints and PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ExpectedVersion = "HunterX (0.5.2)"
          $BotVersion = (& python src/nodriver_tixcraft.py --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $BotVersion -cne $ExpectedVersion) {
            throw "nodriver_tixcraft.py version smoke failed: '$BotVersion'."
          }
          $SettingsVersion = (& python src/settings.py --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $SettingsVersion -cne $ExpectedVersion) {
            throw "settings.py version smoke failed: '$SettingsVersion'."
          }
          $Tokens = $null
          $Errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/build_windows.ps1"),
            [ref]$Tokens,
            [ref]$Errors
          )
          if ($Errors.Count -ne 0) {
            throw "build_windows.ps1 parse failed: $($Errors -join '; ')"
          }

      - name: Run Windows-specific runtime and release regressions
        run: |
          python -m pytest --no-cov `
            tests/test_config.py `
            tests/test_metadata.py `
            tests/test_release_archive_verifier.py `
            tests/test_release_asset_scripts.py `
            tests/test_v052_final_layer_terminal_boundary.py `
            tests/test_v052_final_layer_user_dictionary.py `
            tests/test_v052_final_release_profile.py `
            tests/test_windows_base_builder.py
