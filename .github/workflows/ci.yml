name: CI

on:
  push:
    branches:
      - main
      - feature
      - feature/**
      - fix
      - fix/**
      - chore
      - chore/**
      - refactor
      - refactor/**
      - docs
      - docs/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test, lint, audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirement.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt -r requirements-dev.txt

      - name: Compile source
        run: python -m compileall src

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy

      - name: Pytest with coverage
        run: pytest

      - name: Dependency audit
        run: pip-audit -r requirement.txt

      - name: Bandit high severity scan
        run: bandit -r src scripts -lll -c pyproject.toml

      - name: Benchmarks
        run: |
          pytest tests/benchmarks --benchmark-enable --benchmark-only --benchmark-json=benchmark.json
          python scripts/render_benchmark_chart.py --input benchmark.json --output benchmark-summary.md

      - name: Upload coverage
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 3

      - name: Upload benchmark report
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            benchmark.json
            benchmark-summary.md
          if-no-files-found: error
          retention-days: 3

  windows-build-smoke:
    name: Windows PyInstaller smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirement.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt -r requirements-dev.txt

      - name: Read project version
        id: project
        shell: pwsh
        run: |
          $VersionOutput = & python scripts/release_utils.py project-version --metadata src/hunter_metadata.py
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read the project version (python exit code $LASTEXITCODE)."
          }
          $Version = ($VersionOutput | Out-String).Trim()
          $ArtifactNameOutput = & python scripts/release_utils.py artifact-name --version $Version
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve the artifact name (python exit code $LASTEXITCODE)."
          }
          $ArtifactName = ($ArtifactNameOutput | Out-String).Trim()
          "version=$Version" >> $env:GITHUB_OUTPUT
          "artifact_name=$ArtifactName" >> $env:GITHUB_OUTPUT

      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Version "${{ steps.project.outputs.version }}"

      - name: Upload build smoke artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.project.outputs.artifact_name }}
          path: dist/release/${{ steps.project.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 3
