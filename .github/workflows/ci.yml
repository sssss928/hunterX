name: CI

on:
  push:
    branches:
      - main
      - feature
      - feature/**
      - fix
      - fix/**
      - chore
      - chore/**
      - refactor
      - refactor/**
      - docs
      - docs/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test, lint, audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirement.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt -r requirements-dev.txt

      - name: Compile source, tests, and scripts
        run: python -m compileall src tests scripts

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy

      - name: Pytest with coverage
        run: python -m pytest --cov-fail-under=30

      - name: Dependency audit
        run: pip-audit -r requirement.txt

      - name: Bandit high severity scan
        run: bandit -r src scripts -lll -c pyproject.toml

      - name: Benchmarks
        run: |
          python -m pytest tests/benchmarks --benchmark-enable --benchmark-only --benchmark-json=benchmark.json
          python scripts/render_benchmark_chart.py --input benchmark.json --output benchmark-summary.md

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 3

      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-report
          path: |
            benchmark.json
            benchmark-summary.md
          if-no-files-found: error
          retention-days: 3

  windows-build-smoke:
    name: Windows PyInstaller smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements-lock-windows-py311.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock-windows-py311.txt
          python -m pip install -r requirements-dev.txt

      - name: Read project version
        id: project
        shell: pwsh
        run: |
          $VersionOutput = & python scripts/release_utils.py project-version --metadata src/hunter_metadata.py
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read the project version (python exit code $LASTEXITCODE)."
          }

          $Version = ($VersionOutput | Out-String).Trim()

          $ArtifactNameOutput = & python scripts/release_utils.py artifact-name --version $Version --qualifier final
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve the artifact name (python exit code $LASTEXITCODE)."
          }

          $ArtifactName = ($ArtifactNameOutput | Out-String).Trim()
          $Commit = (git rev-parse HEAD).Trim()

          "version=$Version" >> $env:GITHUB_OUTPUT
          "artifact_name=$ArtifactName" >> $env:GITHUB_OUTPUT
          "commit=$Commit" >> $env:GITHUB_OUTPUT

      - name: Download and verify v0.5.2 RC3 Windows build base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $BaseDir = "dist/base"
          $BaseArchive = Join-Path $BaseDir "hunterX_windows_0.5.2_rc3.zip"
          $ExpectedSha256 = "f2ec4f918e50de5c78c2303a184ef54b0ce69d1ba2f87d34365d87be59d46cd9"

          New-Item -ItemType Directory -Path $BaseDir -Force | Out-Null

          gh release download build-base-v0.5.2-rc3 `
            --repo "${{ github.repository }}" `
            --pattern "hunterX_windows_0.5.2_rc3.zip" `
            --dir $BaseDir `
            --clobber

          if (-not (Test-Path -LiteralPath $BaseArchive -PathType Leaf)) {
            throw "The v0.5.2 RC3 Windows build base was not downloaded."
          }

          $ActualSha256 = (
            Get-FileHash -LiteralPath $BaseArchive -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($ActualSha256 -cne $ExpectedSha256) {
            throw "The v0.5.2 RC3 Windows base SHA-256 mismatch. Expected '$ExpectedSha256', got '$ActualSha256'."
          }

          Write-Host "Verified HunterX v0.5.2 RC3 Windows build base."
          Write-Host "SHA-256: $ActualSha256"

      - name: Build Windows package
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1 `
            -Version "${{ steps.project.outputs.version }}" `
            -BaseArchive "dist/base/hunterX_windows_0.5.2_rc3.zip" `
            -Commit "${{ steps.project.outputs.commit }}" `
            -Qualifier final

      - name: Upload build smoke artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.project.outputs.artifact_name }}
          path: dist/release/${{ steps.project.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 3
